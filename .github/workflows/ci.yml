name: CI

# Lance les tests sur chaque PR et sur les push vers main.
on:
  push:
    branches: [main]
  pull_request:

# Annule un run précédent encore en cours sur la même réf (branche/PR) quand on
# pousse un nouveau commit : on ne garde que le plus récent → économie de minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Même garde-fou que le job `e2e` (cf. son commentaire) : ce job-ci n'a jamais gelé
    # — il tourne en ~2 min — mais il télécharge lui aussi depuis un miroir (`npm ci`),
    # donc il est exposé à la même panne. Laisser un seul job sans borne, c'est le
    # trou par lequel la prochaine attente de six heures passera.
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le formatage
        run: npm run format:check

      - name: Vérifier le lint
        run: npm run lint

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lancer les tests
        run: npm test

  # Tests e2e Playwright (#129) — navigation/rendu réel. BLOQUANT (#413) : la suite
  # est fiabilisée (exécution en série `workers=1`, `retries=1`, `trace: on-first-retry`)
  # et gèle le merge en cas d'échec.
  #
  # DÉCOUPÉE en deux moitiés jouées en parallèle (`--shard`, mesure du 10/10/2026) : la
  # suite en un seul job durait 19 à 23 min, et les tests de la séance partagée (#734)
  # lui ont fait passer la borne de 25 min ci-dessous, coupée à 957 tests sur 973, tous
  # verts. Le commentaire de la borne le prévoyait : découper, pas relever le nombre.
  # `fullyParallel: true` (playwright.config.ts) répartit les TESTS, pas les fichiers,
  # donc les deux moitiés restent équilibrées sans rien régler. Pour découper en trois,
  # ajouter une valeur à `shard` et passer le `/2` du nom et de la commande à `/3`.
  e2e-shard:
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      # Une moitié rouge ne doit pas annuler l'autre : on veut TOUS les échecs d'un run.
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Garde-fou : sans limite explicite, GitHub laisse tourner un job SIX HEURES. Le
    # 19/08/2026, trois jobs bloqués sur le téléchargement d'un paquet apt ont brûlé un
    # runner jusqu'à ce timeout par défaut, en affichant « pending » tout du long — donc
    # sans jamais dire qu'il fallait relancer. Une étape gelée doit échouer VITE et
    # bruyamment. 25 min PAR MOITIÉ laissent une marge large (mesure du 10/10/2026 : la
    # suite entière en prenait 19 à 23 en un seul job, `workers=1` + `retries: 1`), et
    # l'installation du navigateur est quasi instantanée sur cache chaud. Si une moitié
    # s'approche un jour de cette borne, découper davantage, pas relever le nombre.
    timeout-minutes: 25
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Cache des navigateurs Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le navigateur SEUL, sans `--with-deps` (mesure du 19/08/2026). Sur l'image
      # `ubuntu-latest`, les bibliothèques dont Chromium a besoin sont DÉJÀ là : le log
      # de `--with-deps` les listait toutes en « already the newest version », y compris
      # `fonts-noto-color-emoji` (les emojis de l'appli s'affichent donc pareil). Les
      # seuls paquets réellement installés étaient 21 Mo de polices japonaises, chinoises,
      # thaï et X11 historiques — inutiles pour une appli française dont la police
      # d'interface (Nunito) est embarquée dans le dépôt. Et le cache ci-dessus ne couvre
      # QUE le binaire du navigateur, jamais apt : ces 21 Mo se retéléchargeaient à chaque
      # run. Le jour où le miroir Ubuntu a ralenti, cette étape est passée à 24 min (pour
      # 11 min de tests) et a fait mourir trois jobs au timeout de 6 h.
      # Si un jour le navigateur ne se lance plus (« missing dependencies » au démarrage),
      # c'est que l'image du runner a changé : remettre `--with-deps` et rouvrir le sujet.
      - name: Installer Chromium (Playwright)
        run: npx playwright install chromium

      - name: Lancer les tests e2e
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

      # Conserve le rapport HTML et les traces/captures même en cas d'échec : sans
      # `continue-on-error`, une étape de test rouge ferait normalement sauter les
      # suivantes, donc `!cancelled()` force cet upload à s'exécuter quand même.
      # Indispensable pour déboguer l'e2e à distance (le job est désormais bloquant).
      - name: Conserver le rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          # Un nom par moitié : deux artefacts du même nom dans un run se refusent.
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Le check REQUIS par la protection de `main` s'appelle `e2e` : ce job garde ce nom et
  # rend le verdict des deux moitiés. `always()` le fait tourner même quand une moitié
  # échoue ou est annulée, sinon il serait « sauté », et un check requis sauté ne bloque
  # pas un merge.
  e2e:
    needs: e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict des deux moitiés
        run: |
          echo "Moitiés e2e : ${{ needs.e2e-shard.result }}"
          test "${{ needs.e2e-shard.result }}" = "success"
