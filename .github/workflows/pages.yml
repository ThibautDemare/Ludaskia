name: Déploiement GitHub Pages

# Construit le site (Vite) puis le publie quand une *release* GitHub est publiée.
# Merger sur `main` ne déploie plus : `main` est la ligne d'intégration où l'on
# consolide plusieurs PR ; la mise en prod est une action délibérée (publier une
# release `vAAAA.MM.JJ`). `workflow_dispatch` reste un filet de secours manuel
# (déploie alors l'état de la branche par défaut).
on:
  release:
    types: [published]
  workflow_dispatch:

# Permissions nécessaires au déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on n'annule pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Configurer Pages
        uses: actions/configure-pages@v6

      - name: Téléverser l'artefact (dossier dist)
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Déployer vers GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
